# ================================================================
#  Terminator config
# ================================================================
#  change whatever's after the ":", leave the key names alone
#  edit -> save -> /terminatorreload (ops only) or just restart
#
#  ms = milliseconds, 1000 = 1 second
#  damage is in raw points: 20 damage = 10 hearts = a vanilla
#  zombie's entire health bar. keep that in mind
# ================================================================


# ------------------------------------------------
#  shooting
#
#  it's a shortbow. no drawing, shoots the instant
#  you click, and fires 3 arrows at once.
# ------------------------------------------------
shooting:
  # angle of the 2 side arrows off the middle one.
  # 10 is roughly the real thing. more = shotgun,
  # less = laser pointer
  side-spread-degrees: 10.0

  # how long a click counts as "held" instead of tapped.
  # if quick shots don't register, raise this
  hold-window-ms: 250

  # delay between shots. 200 = 0.2s, same as the real Terminator.
  # 0 = full click spam. you've been warned
  shoot-cooldown-ms: 200

  # arrow speed. 3.0 = vanilla full draw. past ~6 you'll
  # start phasing past anything close to you
  arrow-velocity: 4.0

  # each arrow rolls random damage between min and max.
  # yes, these are skyblock numbers. 20k damage vs a
  # 20hp zombie is exactly what it sounds like.
  # also remember: 3 arrows per shot, this is per arrow
  arrow-damage-min: 20000.0
  arrow-damage-max: 50000.0

  # which clicks fire the bow. delete a line to disable it.
  # valid options:
  #   RIGHT_CLICK_AIR, RIGHT_CLICK_BLOCK,
  #   LEFT_CLICK_AIR, LEFT_CLICK_BLOCK
  # left click matters - that's how salvation gets cast,
  # and other plugins love stealing left clicks
  click-actions:
    - RIGHT_CLICK_AIR
    - RIGHT_CLICK_BLOCK
    - LEFT_CLICK_AIR
    - LEFT_CLICK_BLOCK

  # bukkit sound name (ENTITY_ARROW_SHOOT etc.). typo it and
  # it silently falls back to a default shoot sound
  shoot-sound: ENTITY_ARROW_SHOOT
  shoot-sound-volume: 1.0
  shoot-sound-pitch: 1.0

  # makes every arrow a crit. note: soul eater only goes
  # off on crits, so flipping this off basically disables it
  critical-arrows: true


# ------------------------------------------------
#  item
#
#  all cosmetic. the lore stats are flavor text -
#  the actual damage lives in "shooting" above
# ------------------------------------------------
item:
  # keep this BOW. the shooting code checks the item
  # type, so anything else is just a weird paperweight
  material: BOW

  # minimessage tags (<red> etc.), not & codes.
  # the stars are just decoration, go nuts
  display-name: "<light_purple>Precise Terminator <gold>✪✪✪✪<red>➎"

  # hover text. freely editable, just keep the "-" and quotes.
  # a lone "" line is an empty line
  lore:
    - "<gray>Gear Score: <light_purple>1042 <dark_gray>(4163)"
    - "<gray>Damage: <red>374 <yellow>(+30) <dark_gray>(+1,958.53)"
    - "<gray>Strength: <red>110 <yellow>(+30) <gold>[+5] <blue>(+20) <dark_gray>(+599.55)"
    - "<gray>Crit Chance: <red>+68% <blue>(+60%) <dark_gray>(+104.04%)"
    - "<gray>Crit Damage: <red>+280% <dark_gray>(+1,456.05%)"
    - "<gray>Bonus Attack Speed: <red>+44% <dark_gray>(+61.2%)"
    - "<gray>Shot Cooldown: <green>0.2s"
    - ""
    - "<bold><light_purple>Soul Eater V,<reset> <blue>Toxophilite X, Chance V"
    - "<blue>Cubism VI, Divine Gift III, Flame II, Impaling III"
    - "<blue>Dragon Tracer V, Dragon Hunter V, Gravity VI"
    - "<blue>Infinite Quiver X, Overload V, Piercing I"
    - "<blue>Power VII, Punch II, Smoldering V"
    - "<blue>Snipe IV, Tabasco III, Vicious V"
    - ""
    - "<blue>◆ Wake Rune III"
    - ""
    - "<gray>Shoots <aqua>3 <gray>arrows at once."
    - "<gray>Can damage enderman."
    - ""
    - "<red>Divides your <blue>☣ Crit Chance <red>by 4!"
    - ""
    - "<gold>Ability: Salvation <yellow><bold>LEFT CLICK"
    - "<gray>Can be casted after landing <gold>3 <gray>hits."
    - "<gray>Shoot a beam, penetrating up to <yellow>5"
    - "<gray>enemies."
    - "<gray>The beam always crits."
    - "<dark_gray>Soulflow Cost: <dark_aqua>1⸎"
    - ""
    - "<light_purple>Shortbow: Instantly shoots!"
    - ""
    - "<blue>Precise Bonus</blue>"
    - "<gray>Deal</gray> <green>+10%</green> <gray>extra damage when"
    - "<gray>arrows hit the head of a mob.</gray>"
    - ""
    - "<light_purple><bold><obfuscated>A</obfuscated> MYTHIC DUNGEON BOW <obfuscated>A</obfuscated>"


# ------------------------------------------------
#  salvation
#
#  every landed hit charges the bow (T1, T2, T3 in the
#  action bar). full charge = next shot fires a beam
#  straight through everything in its path
# ------------------------------------------------
salvation:
  # hits needed before the beam is ready. 3, like the real one
  hits-required: 3

  # beam range in blocks. walls cut it short
  beam-distance: 32.0

  # max enemies pierced per beam. 5, like the real one
  beam-max-pierce: 5

  # damage per enemy, not split between them.
  # 50k on a 20hp zombie, you do the math
  beam-damage: 50000.0

  # real terminator has no cooldown. the 100ms here is just
  # stopping the beam from double-firing off one click,
  # leave it small
  beam-cooldown-ms: 100

  # particles per block of beam. 2 looks right.
  beam-particles-per-meter: 2.0

  # beam hitbox width. 0.5 = you actually have to aim,
  # 1.0 = basically a free hit
  beam-ray-size: 0.5
